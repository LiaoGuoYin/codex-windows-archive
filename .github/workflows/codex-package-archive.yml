name: Archive Codex Installers

on:
  schedule:
    # GitHub cron uses UTC. 04:00 UTC is 12:00 Asia/Shanghai.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      output_dir:
        description: Working directory generated by the script
        required: false
        default: archive
        type: string
      architectures:
        description: Packages to download (x64, arm64, or both)
        required: false
        default: both
        type: choice
        options:
          - both
          - x64
          - arm64

concurrency:
  group: codex-package-archive
  cancel-in-progress: false

jobs:
  archive:
    name: Archive MSIX packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and publish installers
        shell: bash
        env:
          # Gitea exposes GITEA_ACTIONS=true and supports the github.* aliases.
          CI_PROVIDER: auto
          CI_SERVER_URL: ${{ github.server_url }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_TOKEN: ${{ github.token }}
          OUTPUT_DIR: ${{ inputs.output_dir }}
          ARCHITECTURES: ${{ inputs.architectures }}
        run: bash ./scripts/archive-codex-installers.sh
