name: Archive Codex Installers

on:
  schedule:
    # GitHub cron uses UTC. 04:00 UTC is 12:00 Asia/Shanghai.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      output_dir:
        description: Working directory generated by the script
        required: false
        default: archive
        type: string
      architectures:
        description: Packages to download (x64, arm64, or both)
        required: false
        default: both
        type: choice
        options:
          - both
          - x64
          - arm64

concurrency:
  group: codex-package-archive
  cancel-in-progress: false

jobs:
  network-check:
    name: Check installer network access
    runs-on: ubuntu-latest
    steps:
      - name: Check official download URLs
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://persistent.oaistatic.com/codex-app-prod/ChatGPT-x64.msix"
            "https://persistent.oaistatic.com/codex-app-prod/ChatGPT-arm64.msix"
          )
          for url in "${urls[@]}"; do
            echo "Checking ${url}"
            curl --fail --silent --show-error --location --head \
              --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 \
              "${url}" >/dev/null
          done

  download-and-archive:
    name: Download and archive MSIX packages
    needs: network-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download packages and create checksums
        id: download
        shell: bash
        env:
          ARCHIVE_DIR: ${{ inputs.output_dir }}
          ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          set -euo pipefail
          archive_dir="${ARCHIVE_DIR:-archive}"
          if [[ "${ARCHITECTURES:-both}" == "both" ]]; then
            bash ./scripts/download-codex-installers.sh "${archive_dir}"
          else
            bash ./scripts/download-codex-installers.sh "${archive_dir}" "${ARCHITECTURES}"
          fi

          version="$(cut -f2 "${archive_dir}/manifest.tsv" | sort -u)"
          if [[ -z "${version}" || "${version}" == *$'\n'* ]]; then
            echo "Expected one package version, found: ${version}" >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "Invalid package version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check for existing release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.download.outputs.version }}
          ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          set -euo pipefail
          architecture="${ARCHITECTURES:-both}"
          if [[ "${architecture}" == "both" ]]; then
            release_stem="codex-win"
            bundle_stem="codex-installers"
          else
            release_stem="codex-win-${architecture}"
            bundle_stem="codex-installers-${architecture}"
          fi
          tag="${release_stem}-v${VERSION}"
          published=false
          draft=false

          if is_draft="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "${is_draft}" == "true" ]]; then
              draft=true
              echo "Draft release ${tag} exists; its bundle will be retried."
            else
              published=true
              echo "Published release ${tag} already exists; skipping upload."
            fi
          fi

          {
            echo "tag=${tag}"
            echo "bundle_stem=${bundle_stem}"
            echo "published=${published}"
            echo "draft=${draft}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create versioned bundle
        id: bundle
        if: steps.release.outputs.published != 'true'
        shell: bash
        env:
          ARCHIVE_DIR: ${{ inputs.output_dir }}
          VERSION: ${{ steps.download.outputs.version }}
          BUNDLE_STEM: ${{ steps.release.outputs.bundle_stem }}
        run: |
          set -euo pipefail
          archive_dir="${ARCHIVE_DIR:-archive}"
          bundle_path="${RUNNER_TEMP}/${BUNDLE_STEM}-${VERSION}.zip"
          (cd "${archive_dir}" && zip -q -r "${bundle_path}" .)
          echo "path=${bundle_path}" >> "${GITHUB_OUTPUT}"

      - name: Publish release
        if: steps.release.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.download.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BUNDLE_PATH: ${{ steps.bundle.outputs.path }}
          RELEASE_IS_DRAFT: ${{ steps.release.outputs.draft }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_IS_DRAFT}" == "true" ]]; then
            gh release upload "${RELEASE_TAG}" "${BUNDLE_PATH}" \
              --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --draft=false
          else
            gh release create "${RELEASE_TAG}" "${BUNDLE_PATH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Codex Windows ${VERSION}" \
              --notes "Archived from the official Codex Windows installer URLs."
          fi
