name: Archive Codex Installers

on:
  schedule:
    # GitHub cron uses UTC. 04:00 UTC is 12:00 Asia/Shanghai.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      output_dir:
        description: Artifact directory generated by the script
        required: false
        default: archive
        type: string
      architectures:
        description: Packages to download (x64, arm64, or both)
        required: false
        default: both
        type: choice
        options:
          - both
          - x64
          - arm64

jobs:
  network-check:
    name: Check installer network access
    runs-on: ubuntu-latest
    steps:
      - name: Check official download URLs
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://persistent.oaistatic.com/codex-app-prod/ChatGPT-x64.msix"
            "https://persistent.oaistatic.com/codex-app-prod/ChatGPT-arm64.msix"
          )
          for url in "${urls[@]}"; do
            echo "Checking ${url}"
            curl --fail --silent --show-error --location --head \
              --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 \
              "${url}" >/dev/null
          done

  download-and-archive:
    name: Download and archive MSIX packages
    needs: network-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download packages and create checksums
        shell: bash
        env:
          ARCHIVE_DIR: ${{ inputs.output_dir }}
          ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          set -euo pipefail
          archive_dir="${ARCHIVE_DIR:-archive}"
          if [[ "${ARCHITECTURES:-both}" == "both" ]]; then
            bash ./scripts/download-codex-installers.sh "${archive_dir}"
          else
            bash ./scripts/download-codex-installers.sh "${archive_dir}" "${ARCHITECTURES}"
          fi

      - name: Upload packages to artifact storage
        uses: actions/upload-artifact@v4
        with:
          name: codex-installers-${{ github.run_number }}
          path: ${{ inputs.output_dir || 'archive' }}/
          if-no-files-found: error
          retention-days: 30
